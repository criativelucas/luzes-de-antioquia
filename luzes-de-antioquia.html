<meta charset="utf-8">
<title>Luzes de Antioquia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: full-bleed 3D diorama of Antioch; HUD floats in the corners like a game screen; the Códice opens as parchment */
:root{
  color-scheme: dark;
  --night:#0d1526;
  --ink:#f7eedb;
  --ink-dim:rgba(247,238,219,.64);
  --lamp:#f2c46b;
  --lamp-hi:#ffdf9e;
  --glass:rgba(24,20,17,.56);
  --glass-hi:rgba(30,25,20,.9);
  --line:rgba(255,236,200,.16);
  --clay:#ddd0b8;
  --clay-ink:#33271c;
  --paper:#f2e7cc;
  --paper-ink:#3a2b1b;
  --paper-dim:#7e684a;
  --ok:#a6d27f;
  --bad:#e58a6f;
  --sans:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font:600 14px/1.4 var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px) saturate(1.15);-webkit-backdrop-filter:blur(10px) saturate(1.15);box-shadow:0 8px 28px rgba(0,0,0,.28)}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 95% at 50% 45%,transparent 58%,rgba(5,4,3,.5) 100%)}
#hud{position:fixed;inset:0;pointer-events:none;z-index:4}
#hud > *{pointer-events:auto}
body.photo #hud,body.photo #pop,body.photo #tip,body.photo #toasts{display:none!important}

#tl{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));padding:10px 14px 9px;min-width:210px}
#tl .row{display:flex;align-items:baseline;gap:7px}
.spark{color:var(--lamp);font-size:17px;text-shadow:0 0 10px rgba(242,196,107,.7)}
#comm{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.lbl{color:var(--ink-dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin:6px 0 7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lamp),var(--lamp-hi));transition:width .5s}
#clock{font-size:13px;font-variant-numeric:tabular-nums}
#members{color:var(--ink-dim);font-size:12.5px}

#tc{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
#res{display:flex;gap:30px;padding:4px 10px;text-shadow:0 1px 8px rgba(0,0,0,.75)}
.res{display:flex;align-items:center;gap:7px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.res svg{width:24px;height:24px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))}
.res.bump{animation:bump .55s}
@keyframes bump{30%{transform:scale(1.25);color:var(--lamp-hi)}}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(226,214,194,.86);color:#2b2118;border-radius:9px;padding:9px 18px;font-weight:800;box-shadow:0 4px 18px rgba(0,0,0,.32);transition:background .2s}
.pill:hover{background:#f3e8d1}
.pill:disabled{opacity:.62;cursor:default}
.pill svg{width:18px;height:18px}

#tr{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
#bl{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:calc(14px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.icon-btn{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;background:rgba(226,214,194,.8);color:#3a2d20;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.3);font-weight:800;font-size:15px;transition:background .2s,transform .15s}
.icon-btn:hover{background:#f3e8d1}
.icon-btn:active{transform:scale(.95)}
.icon-btn.on{background:var(--lamp)}
.icon-btn svg{width:24px;height:24px}
.badge{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:#e2604a;box-shadow:0 0 0 2px rgba(255,255,255,.5);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}

#dial{position:absolute;left:calc(72px + env(safe-area-inset-left,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));padding:14px 16px 12px;width:210px}
#dial svg{width:170px;height:170px;display:block;margin:0 auto;touch-action:none;cursor:grab}
#dial .dt{font:700 22px var(--serif);fill:var(--ink)}
#dial .di{font-size:20px;fill:var(--lamp-hi)}
#dial .tk{font:700 9px var(--sans);fill:var(--ink-dim)}
#dial label{display:flex;flex-direction:column;gap:4px;margin-top:6px;font-size:12px;color:var(--ink-dim)}
#dial input{width:100%;accent-color:var(--lamp)}
#snd{position:absolute;top:calc(126px + env(safe-area-inset-top,0px));right:calc(72px + env(safe-area-inset-right,0px));width:240px;max-height:calc(100% - 140px);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
#snd .snd-h{font:700 20px var(--serif);color:var(--lamp-hi)}
#snd label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-dim)}
#snd input{width:100%;accent-color:var(--lamp)}
#snd .ghost{margin-top:2px}
#camMenu{position:absolute;left:calc(72px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:260px;padding:10px;display:flex;flex-direction:column;gap:7px}
.lbl2{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-top:4px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{padding:6px 0;border-radius:7px;border:1px solid var(--line);font-size:12px;color:var(--ink-dim)}
.seg button.on{background:var(--lamp);color:#2b2118;border-color:var(--lamp)}
#event{font-size:12.5px;color:var(--lamp-hi);margin-top:2px}
.oven{height:150px;border-radius:90px 90px 14px 14px;background:radial-gradient(120% 90% at 50% 100%,#ff8a3a 0%,#7a2e10 38%,#2a1408 75%);display:grid;place-items:center;box-shadow:inset 0 -10px 30px rgba(0,0,0,.5);margin-bottom:16px}
.loaf{width:150px;height:66px;border-radius:50% 50% 42% 42%/60% 60% 40% 40%;background:var(--c,#f1e3c4);box-shadow:inset 0 -8px 14px rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.4);position:relative}
.loaf::after{content:"";position:absolute;inset:22% 18%;background:repeating-linear-gradient(115deg,transparent 0 16px,rgba(0,0,0,.18) 16px 19px)}
.heat{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,#f1e3c4,#e7c27a 40%,#c98a45 58%,#7a4420 78%,#2e1a0e)}
.heat .zone{position:absolute;top:-5px;bottom:-5px;border:2px solid var(--lamp-hi);border-radius:6px;box-shadow:0 0 10px rgba(255,223,158,.6)}
.heat .mark{position:absolute;top:-8px;width:4px;height:30px;margin-left:-2px;border-radius:2px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.6)}
.loom{display:flex;flex-direction:column;gap:3px;min-height:68px;padding:10px;border-radius:10px;background:#3a2a1c;margin-bottom:14px;box-shadow:inset 0 0 0 3px #6b4a2f}
.loom .row{display:flex;gap:2px;height:12px}
.loom .row i{flex:1;border-radius:2px}
.threads{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.thread{height:64px;border-radius:12px;background:var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25);transition:transform .12s,filter .12s;filter:saturate(.75) brightness(.85)}
.thread.lit{transform:scale(1.08);filter:saturate(1.2) brightness(1.25);box-shadow:0 0 18px var(--c)}
.thread:disabled{cursor:default}
.boat{width:100%;max-width:360px;display:block;margin:0 auto}
.boat .hull{transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-origin:0px 20px}
.sides{display:flex;gap:10px;justify-content:center;margin-top:10px}
.cargo-next{margin:6px 0 2px;color:var(--ink-dim)}
.cargo-next b{color:var(--ink)}
.msg{min-height:1.4em;color:var(--ink-dim);margin:10px 0 0}
#modal.mini{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;pointer-events:none;place-items:center end;padding:16px calc(18px + env(safe-area-inset-right,0px)) 16px 16px}
#modal.mini > *{pointer-events:auto}
#modal.mini .card{width:min(370px,calc(100vw - 32px));max-height:calc(100vh - 110px);padding:15px 18px 14px;background:rgba(22,18,14,.76);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#modal.mini .card h2{font-size:25px}
#modal.mini .hint{margin-bottom:8px}
#modal.mini .oven{height:86px;margin-bottom:12px}
#modal.mini .loaf{width:110px;height:48px}
#modal.mini .olv{width:290px;margin:0 auto}
#modal.mini .thread{height:52px}
#modal.mini .loom{min-height:48px}
.vessel{position:relative;width:110px;height:130px;margin:4px auto 10px;border-radius:14px 14px 40px 40px;background:linear-gradient(#5a3a22,#3a2414);overflow:hidden;box-shadow:inset 0 0 0 3px #8a5a34;cursor:pointer;touch-action:none}
.vessel .oil{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#e8b84a,#b8822a)}
.vessel .band{position:absolute;left:-2px;right:-2px;border-top:2px solid var(--lamp-hi);border-bottom:2px solid var(--lamp-hi);background:rgba(255,223,158,.18)}
.hymn{cursor:pointer;background:#1c1712}
@media (max-width:760px){#modal.mini{place-items:end center;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}#modal.mini .card{max-height:50vh}}
#rainbow{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity 5s;mix-blend-mode:screen;background:radial-gradient(circle at 72% 118%,transparent 57%,rgba(255,70,60,.2) 58.2%,rgba(255,165,50,.2) 59.6%,rgba(255,235,90,.18) 61%,rgba(90,215,110,.16) 62.4%,rgba(70,150,255,.16) 63.8%,rgba(130,80,220,.14) 65.2%,transparent 66.6%)}
#rainbow.on{opacity:1}
.card.album{width:min(920px,calc(100vw - 32px));text-align:left}
.mems{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:8px}
.mem{display:flex;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.ptr{flex:none;width:56px;height:56px}
.mi{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.mi b{font:700 19px/1.1 var(--serif);color:var(--lamp-hi)}
.mi small{color:var(--ink-dim);font-size:12px}
.mi em{font:italic 500 15px/1.35 var(--serif);color:var(--ink)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.tag{font-size:11.5px;color:var(--lamp);letter-spacing:.04em}
.find{font-size:12px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);color:var(--ink-dim)}
.card.letter{background:linear-gradient(#f2e6c9,#e3d0a4);color:var(--paper-ink);text-align:left;width:min(520px,calc(100vw - 32px))}
.card.letter h2{color:#5a3a1c}
.card.letter .eyebrow{color:#9a6a2a}
.card.letter .x{background:rgba(60,40,20,.12);color:var(--paper-ink)}
.ltxt{font:500 19px/1.55 var(--serif);margin:8px 0}
.lsig{font:italic 600 16px var(--serif);color:#7a5a3a;text-align:right;margin:4px 0 12px}
.lsig span{font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:#9a7a54}
.page .pt{font:700 21px/1.2 var(--serif);margin:0 0 8px;color:#7a4a22}
.page .lref{margin:16px 0 0;font:700 11.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#8a6a44;text-align:right}

#toasts{position:fixed;z-index:25;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:min(560px,calc(100vw - 140px))}
.toast{padding:10px 16px;border-radius:12px;background:rgba(22,18,14,.82);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35);text-align:center;animation:tin .4s ease-out;transition:opacity .5s,transform .5s}
.toast.out{opacity:0;transform:translateY(8px)}
.toast .v{display:block;font:italic 600 18px/1.35 var(--serif);color:var(--lamp-hi)}
.ref,.toast .ref{display:block;margin-top:3px;font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.dim{color:var(--ink-dim)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

#tip{position:fixed;z-index:7;pointer-events:none;padding:6px 10px;border-radius:8px;background:rgba(20,16,12,.85);border:1px solid var(--line);font-size:13px;white-space:nowrap}
#tip small{display:block;color:var(--ink-dim);font-weight:600;font-size:12px}

#pop{position:fixed;z-index:8;width:min(290px,calc(100vw - 32px));padding:14px}
.pop-h{font:700 22px/1.1 var(--serif);color:var(--lamp-hi)}
.pop-r{color:var(--ink-dim);font-size:12.5px;margin-top:2px}
.pop-t{font:italic 600 17px/1.35 var(--serif);margin:10px 0 2px}
.pop-acts{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.act{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:9px 12px;border-radius:9px;background:rgba(242,196,107,.14);border:1px solid rgba(242,196,107,.35);transition:background .15s}
.act:hover:not(:disabled){background:rgba(242,196,107,.28)}
.act b{font-weight:800}
.act small{color:var(--ink-dim);font-size:12px}
.act:disabled{cursor:default;background:rgba(255,255,255,.04);border-color:var(--line);opacity:.75}

#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,6,4,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px}
.card{position:relative;width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;padding:24px 26px 22px;border-radius:18px;background:var(--glass-hi);border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.5);text-align:center;animation:tin .35s ease-out}
.card h2{font:700 32px/1.05 var(--serif);margin:0 0 8px;color:var(--lamp-hi);text-wrap:balance}
.card .hint{color:var(--ink-dim);margin:0 0 14px;font-size:13.5px;text-wrap:balance}
.card p{text-wrap:pretty}
.x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.08);font-size:17px;color:var(--ink)}
.eyebrow{font:700 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--lamp);margin:0 0 6px}
.intro{width:min(520px,calc(100vw - 32px));text-align:left}
.intro p{font:500 18px/1.5 var(--serif);margin:10px 0}
.intro .v{font-style:italic;color:var(--lamp-hi);border-left:2px solid var(--lamp);padding-left:12px}
.intro .go,.result .go{margin-top:10px}
.big{font:700 46px/1.1 var(--serif);color:var(--lamp-hi);margin:6px 0}
.pips{display:flex;gap:8px;justify-content:center;margin-top:10px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid rgba(247,238,219,.4)}
.pip.ok{background:var(--ok);border-color:var(--ok)}
.pip.bad{background:var(--bad);border-color:var(--bad)}
.olv{width:100%;border-radius:12px;display:block;touch-action:none;cursor:none;background:#cfe0e8}
.mg-stats{display:flex;justify-content:space-between;margin-top:10px;font-variant-numeric:tabular-nums}
.scroll-line{min-height:100px;padding:16px 18px;border-radius:10px;background:linear-gradient(#f2e6c9,#e3d0a4);color:var(--paper-ink);font:600 21px/1.45 var(--serif);text-align:left;box-shadow:inset 0 0 0 1px rgba(90,60,30,.25)}
.caret{color:#a06a2a;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.copy .ref{margin:8px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chip{padding:7px 12px;border-radius:8px;background:var(--clay);color:var(--clay-ink);font:700 16px var(--serif);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.chip.used{opacity:.22;box-shadow:none}
.chip.shake{animation:shake .35s;background:#eab3a1}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.howto{text-align:left;padding-left:18px;margin:6px 0 12px;display:flex;flex-direction:column;gap:7px}
.keys{color:var(--ink-dim);font-size:12.5px}
.ghost{margin-top:8px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);color:var(--ink-dim)}
.ghost[data-armed]{border-color:var(--bad);color:var(--bad)}

.book{position:relative;display:grid;grid-template-columns:290px minmax(0,1fr);gap:22px;width:min(1080px,calc(100vw - 32px));max-height:calc(100vh - 40px);padding:24px;border-radius:18px;background:linear-gradient(160deg,#e9dcb8,#d6c193);color:var(--paper-ink);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(80,60,30,.25),inset 0 0 60px rgba(120,90,40,.28);animation:tin .35s ease-out}
.book>*{min-width:0}
.book .x{background:rgba(60,40,20,.12);color:var(--paper-ink)}
.book h2{font:700 34px/1 var(--serif);margin:2px 0 14px}
.chlist{display:flex;flex-direction:column;gap:9px;overflow:auto;max-height:calc(100vh - 150px);padding:2px 6px 2px 2px}
.ch{display:flex;gap:12px;align-items:center;text-align:left;padding:9px 10px;border-radius:10px;background:rgba(255,250,235,.55);border:1px solid rgba(90,70,40,.18);color:var(--paper-ink)}
.ch.sel{background:#e1e5b9;border-color:#9aa45e}
.ch.locked{opacity:.55}
.cover{flex:none;width:42px;height:56px;border-radius:4px;display:grid;place-items:center;font-size:21px;background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:2px 3px 6px rgba(0,0,0,.25)}
.ch.locked .cover{filter:grayscale(1)}
.meta{min-width:0;flex:1}
.meta b{display:block;font:700 18px/1.1 var(--serif)}
.meta small{display:flex;justify-content:space-between;gap:10px;color:var(--paper-dim);font:600 12.5px var(--sans);margin-top:4px}
.spread{display:flex;flex-direction:column;min-width:0}
.spread h3{font:700 28px/1.1 var(--serif);text-align:center;margin:4px 40px 12px;text-wrap:balance}
.pages{display:grid;grid-template-columns:1fr 1fr;background:#5a3e22;padding:8px;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.3);height:min(470px,calc(100vh - 210px))}
.page{position:relative;background:linear-gradient(90deg,#f4ead2,#efe2c4);padding:28px 30px 42px;font:500 19px/1.5 var(--serif);color:var(--paper-ink);overflow:auto}
.page:first-child{border-radius:4px 0 0 4px;box-shadow:inset -18px 0 24px -12px rgba(90,60,20,.35)}
.page:last-child{border-radius:0 4px 4px 0;box-shadow:inset 18px 0 24px -12px rgba(90,60,20,.35)}
.page:only-child{border-radius:4px}
.page .txt{margin:0}
.page .txt::first-letter{font-size:2.7em;float:left;line-height:.85;padding:5px 7px 0 0;color:#7a4a22;font-weight:700}
.page blockquote{margin:18px 0 0;padding:14px 4px 0;border-top:1px solid rgba(90,60,30,.25);font-style:italic;color:#5a3d22;text-align:center}
.page blockquote cite{display:block;margin-top:6px;font:700 11.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#8a6a44;font-style:normal}
.page .pn{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:15px;color:#8a7350}
.page.locked .pgb{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;color:#8a7350;gap:6px}
.page.locked .lk{font-size:30px;filter:grayscale(.6)}
.page.locked .h{font-style:italic;max-width:24ch}
.page.empty{background:linear-gradient(90deg,#efe4c9,#e9dbbb)}
.bnav{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px;font:600 14px var(--sans);color:var(--paper-dim);font-variant-numeric:tabular-nums}
.bnav button{width:38px;height:38px;border-radius:50%;background:rgba(90,62,34,.12);font-size:22px;color:var(--paper-ink)}
.bnav button:disabled{opacity:.3;cursor:default}
.float{position:fixed;z-index:6;pointer-events:none;font:800 18px var(--sans);color:var(--lamp-hi);text-shadow:0 2px 8px rgba(0,0,0,.8);animation:rise 1.5s ease-out forwards}
@keyframes rise{from{transform:translate(-50%,0)}to{transform:translate(-50%,-56px);opacity:0}}
#photoExit{position:fixed;z-index:9;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));padding:8px 14px;border-radius:9px;background:rgba(20,16,12,.6);border:1px solid var(--line);color:var(--ink);opacity:.7}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:italic 600 22px var(--serif);color:var(--lamp-hi);z-index:30;background:var(--night)}

@media (max-width:760px){
  .book{grid-template-columns:minmax(0,1fr);padding:16px;overflow:auto}
  .chlist{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}
  .ch{min-width:210px}
  .pages{grid-template-columns:1fr;height:auto;min-height:360px}
  .spread h3{margin:4px 0 10px}
}
@media (max-width:640px){
  #tl{min-width:0;padding:8px 10px}
  #tc{top:calc(92px + env(safe-area-inset-top,0px))}
  #res{gap:16px}
  .res{font-size:17px}
  .res svg{width:20px;height:20px}
  .icon-btn{width:42px;height:42px}
  #toasts{width:calc(100vw - 32px);bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  #dial{left:calc(64px + env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

function mergeStatic(root) {
  root.updateMatrixWorld(true);
  const buckets = new Map(), done = [];
  root.traverse(o => {
    if (!o.isMesh || o.isInstancedMesh) return;
    const key = o.material.uuid + (o.castShadow ? 'c' : 'n');
    let b = buckets.get(key); if (!b) buckets.set(key, b = { m: o.material, cast: o.castShadow, geos: [] });
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    for (const name of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(name)) g.deleteAttribute(name);
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    g.morphAttributes = {}; g.applyMatrix4(o.matrixWorld); b.geos.push(g); done.push(o);
  });
  for (const o of done) o.parent.remove(o);
  for (const b of buckets.values()) {
    const geo = mergeGeometries(b.geos, false);
    if (!geo) { console.warn('merge failed'); continue; }
    const me = new THREE.Mesh(geo, b.m); me.castShadow = b.cast; me.receiveShadow = true; root.add(me);
  }
}

/* ========================= main loop ========================= */
let last = performance.now(), hudT = 0, saveT = 0, ringT = 0;

}
function step(dt, t) {

  const dh = rate * dt; G.time += dh; G.clock += dh;
  if (ff && G.time >= ff.to) { G.time = ff.to; ff = null; refreshHUD(); }
  timeEvents(); updateNeeds(dh);
  updateLighting(); updateRain(dt); updateSky(dt, t);
  updateFishSchools(t); updateRig(dt, t);
  for (const n of npcs) n.update(dt, t);
  updateLife(dt, t);
  for (const l of lanterns) { const u = l.userData; l.position.x += u.vx * dt; if (l.position.x > 50) l.position.x = -50; l.position.z = u.z0 + Math.sin(t * 0.3 + u.ph) * 0.5; l.position.y = -0.58 + Math.sin(t * 1.7 + u.ph) * 0.03; l.rotation.y = Math.sin(t * 0.4 + u.ph) * 0.3; }
  for (const b of [boat, boat2]) { b.position.y = -0.62 + Math.sin(t * 1.2 + b.userData.ph) * 0.04; b.rotation.z = Math.sin(t * 0.9 + b.userData.ph) * 0.025; }
  boat.rotation.x += (boatTilt - boat.rotation.x) * Math.min(1, dt * 5);
  if (boat.userData.away) { boat.position.x += 2.4 * dt; if (boat.position.x > 52) boat.visible = false; }
  if (lampOn > 0.01) { const fa = ffGeo.attributes.position.array; ffBase.forEach(([x, y, z, ph], i) => { fa[i * 3] = x + Math.sin(t * 0.5 + ph) * 1.2; fa[i * 3 + 1] = y + Math.sin(t * 1.3 + ph * 2) * 0.35; fa[i * 3 + 2] = z + Math.cos(t * 0.4 + ph) * 1.2; }); ffGeo.attributes.position.needsUpdate = true; }
  ringT -= dt;
  for (const h of HOT) {
    if (ringT <= 0) h.live = h.actions().some(a => a.ok() && cdLeft(a.cd) <= 0);
    h.mat.color.copy(h.live ? GOLD : GREY); h.mat.opacity = h.live ? 0.6 + 0.3 * Math.sin(t * 2.4) : 0.45;

}

/* ========================= boot ========================= */
function start(data) {
